name: Performer Site Sync
description: Synchronize performer metadata and favorite performers or studios between Stash and configured StashBox sources.
version: 2.0.2
url: https://github.com/MirageOne/Stash-Plugins/tree/main/plugins/performer-site-sync
interface: raw
exec:
  - python
  - "{pluginDir}/performer_site_sync.py"

settings:
  cacheExpirationHours:
    displayName: Cache Expiration (Hours)
    description: How long successful StashBox responses are cached.
    type: NUMBER
  rateLimit:
    displayName: Minimum Request Delay (Seconds)
    description: Additional delay between StashBox requests. StashBox request limits are respected as well.
    type: NUMBER
  enableStashDB:
    displayName: Enable StashDB
    description: Use the configured StashDB box for sync operations.
    type: BOOLEAN
  enableTPDB:
    displayName: Enable ThePornDB
    description: Use the configured ThePornDB box for sync operations.
    type: BOOLEAN
  enableFansDB:
    displayName: Enable FansDB
    description: Use the configured FansDB box for sync operations.
    type: BOOLEAN
  sourcePrecedence:
    displayName: Source Precedence
    description: Comma-separated merge priority, highest priority first (stashdb,tpdb,fansdb).
    type: STRING
  enableNameSearch:
    displayName: Match Performers by Name
    description: Search for exact name matches when a local performer has no ID for a source.
    type: BOOLEAN
  overwriteExisting:
    displayName: Overwrite Existing Metadata
    description: Replace populated local fields with values from the highest-priority configured source.
    type: BOOLEAN
  performerImageUpdate:
    displayName: Update Performer Images
    description: Import a source image when enabled, respecting the overwrite setting.
    type: BOOLEAN
  autoCreatePerformers:
    displayName: Create Missing Performers
    description: Create local performers when importing favorites that do not already exist.
    type: BOOLEAN
  autoCreateStudios:
    displayName: Create Missing Studios
    description: Create local studios when importing favorite studios that do not already exist.
    type: BOOLEAN

tasks:
  - name: Update All Performers
    description: Fill or refresh performer metadata from matching configured StashBox records.
    defaultArgs:
      mode: update_all_performers
  - name: Sync Favorite Performers
    description: Mark matching local performers as favorites, optionally creating missing records.
    defaultArgs:
      mode: sync_favorite_performers
  - name: Sync Favorite Studios
    description: Mark matching local studios as favorites, optionally creating missing records.
    defaultArgs:
      mode: sync_favorite_studios
  - name: Test Connections
    description: Test authentication and GraphQL access for enabled, configured StashBox sources.
    defaultArgs:
      mode: test_connections
  - name: Validate Configuration
    description: Check source detection and configuration without making external requests.
    defaultArgs:
      mode: validate_config
  - name: Clear Cache
    description: Remove cached StashBox responses.
    defaultArgs:
      mode: clear_cache
  - name: Generate Sync Report
    description: Report performer, studio, and source ID coverage in the local library.
    defaultArgs:
      mode: generate_sync_report

ui:
  javascript:
    - performer_site_sync.js
