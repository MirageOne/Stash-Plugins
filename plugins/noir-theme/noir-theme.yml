name: Noir
description: Dark, video-first Stash theme with flat charcoal and violet styling, a collapsible sidebar, and readable statistics dashboards.
version: 1.1.8
url: https://github.com/MirageOne/Stasher
ui:
  assets:
    /: .
  javascript:
    - noir-theme.js
  css:
    - css/01_tokens.css
    - css/02_navbar.css
    - css/03_cards.css
    - css/04_filters.css
    - css/05_list_views.css
    - css/06_scene_player.css
    - css/07_scene_details.css
    - css/08_misc_mid.css
    - css/09_buttons.css
    - css/10_pills_badges.css
    - css/11_misc_tail.css
    - css/12_mobile.css
    - css/13_plugins.css
    - css/14_light.css
    - css/16_playing_card.css
    - css/17_scroll_perf.css
    - css/15_lite.css
    - css/18_noir_theme.css
    - css/19_noir_sidebar.css
    - css/20_noir_pages.css
    - css/21_noir_settings.css
    - css/22_noir_stats.css
    - css/23_noir_settings_menu.css
    - css/24_noir_controls.css
settings:
  accent:
    displayName: Accent color
    description: Choose the theme accent color.
    type: STRING
