name: Scene Gallery Builder
description: Generate selectable numbers of scene-named still images, ZIP galleries, and scene-linked metadata.
version: 1.0.0
url: https://github.com/MirageOne/Stash-Plugins/tree/main/plugins/scene-gallery-builder
settings:
  autoGenerate:
    displayName: Automatically generate galleries for new scenes
    description: Queue a gallery when Stash creates a scene. This is disabled by default.
    type: BOOLEAN
  defaultImageCount:
    displayName: Default images per scene
    description: Number of images generated automatically for each new scene. The plugin page also has a per-run image count input.
    type: NUMBER
  imageLibraryPath:
    displayName: Image library path
    description: Optional image-enabled Stash library path for automatic generation. Leave empty to use the first image-enabled library.
    type: STRING
exec:
  - python
  - "{pluginDir}/scene_gallery_task.py"
interface: raw
tasks:
  - name: Generate scene galleries
    description: Extract selectable scene stills, create a scene-named ZIP Gallery, copy supported metadata, and link it to the source scene.
    defaultArgs:
      mode: generate
hooks:
  - name: Scene.Create.Post
    description: Queue a gallery for a newly created scene when automatic generation is enabled.
ui:
  assets:
    /: .
  javascript:
    - inject.js
