<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rebirth — Neutral icon mobile navigation flyout concept</title>
  <style>
    :root {
      color-scheme: dark;
      --surface: #13161a;
      --raised: #1b1f24;
      --line: #2b3138;
      --line-strong: #3a424b;
      --text: #f1f3f4;
      --muted: #b0b7bd;
      --quiet: #858e97;
      --accent: #a076e8;
    }
    @font-face {
      font-family: Geist;
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("../fonts/geist-latin-wght-normal.woff2") format("woff2-variations");
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; background: #080a0d; color: var(--text); font: 14px/1.5 Geist, ui-sans-serif, system-ui, sans-serif; }
    button, a { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .screen { position: fixed; z-index: 0; top: 0; left: 50%; width: min(100vw, 430px); height: 100dvh; object-fit: cover; object-position: center; transform: translateX(-50%); }
    .backdrop { position: fixed; z-index: 2; inset: 0; background: transparent; animation: fade-in .15s ease-out both; }
    .backdrop[hidden], .sheet[hidden], .flyout-tip[hidden] { display: none; }
    .sheet {
      position: fixed;
      z-index: 5;
      top: auto;
      right: max(10px, calc((100vw - 430px) / 2 + 10px));
      bottom: calc(66px + env(safe-area-inset-bottom));
      left: max(10px, calc((100vw - 430px) / 2 + 10px));
      width: auto;
      height: min(56vh, 520px);
      max-height: calc(100dvh - 132px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 14px 13px 13px;
      border: 1px solid var(--line);
      border-top: 2px solid var(--accent);
      border-radius: 14px 14px 8px 8px;
      background: var(--surface);
      box-shadow: 0 14px 36px rgba(0, 0, 0, .38);
      animation: rise-in .17s ease-out both;
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise-in { from { opacity: .8; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .sheet-head { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; padding: 0 3px; }
    .sheet-head h1 { margin: 0; font-size: 19px; font-weight: 740; letter-spacing: -.02em; }
    .close { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 7px; background: var(--raised); color: var(--text); font-size: 20px; line-height: 1; cursor: pointer; }
    .routes { min-height: 0; flex: 1; overflow-y: auto; overscroll-behavior: contain; scrollbar-color: var(--line-strong) transparent; scrollbar-width: thin; }
    .route-section { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
    .route-section + .route-section { margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--line); }
    .section-title { grid-column: 1 / -1; margin: 0 0 1px; padding-left: 4px; color: var(--quiet); font-size: 11px; font-weight: 740; line-height: 18px; letter-spacing: .08em; }
    .route { min-height: 75px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; margin: 0; padding: 7px 3px; border: 1px solid var(--line); border-radius: 8px; background: rgba(27, 31, 36, .3); color: var(--muted); font-size: 12px; line-height: 1.2; text-align: center; text-decoration: none; }
    .route:hover, .route[aria-current="page"] { border-color: rgba(160, 118, 232, .46); color: var(--text); background: var(--raised); }
    .route:hover .icon, .route[aria-current="page"] .icon { stroke: var(--accent); }
    .route .icon { width: 42px; height: 42px; flex: 0 0 42px; display: block; padding: 4px; border-radius: 8px; background: transparent; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .route-label { flex: 1; }
    .route-arrow { display: none; }
    .dock-preview { position: fixed; z-index: 3; bottom: 0; left: 50%; width: min(100vw, 430px); height: 62px; display: flex; align-items: stretch; justify-content: space-around; gap: 2px; padding: 5px 6px max(5px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--surface); transform: translateX(-50%); }
    .dock-item { min-width: 0; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; border-radius: 4px; background: transparent; color: var(--quiet); font-size: 9px; line-height: 1; text-decoration: none; }
    .dock-item .dock-icon { width: 18px; height: 18px; display: grid; place-items: center; font-size: 18px; line-height: 1; }
    .dock-item svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .dock-item.more-active { border: 1px solid rgba(160, 118, 232, .34); background: rgba(160, 118, 232, .14); color: var(--accent); }
    .flyout-tip { display: none; }
    @media (max-height: 660px) { .sheet { height: calc(100vh - 112px); max-height: calc(100vh - 112px); } .route { min-height: 68px; } .route .icon { width: 36px; height: 36px; flex-basis: 36px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <img class="screen" src="../screenshots/mobile-home.png" alt="Rebirth mobile home screen">
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>
  <nav class="dock-preview" aria-label="Primary navigation">
    <a class="dock-item" href="#home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
    <a class="dock-item" href="#scenes"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16"/></svg><span>Scenes</span></a>
    <a class="dock-item" href="#images"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span>Images</span></a>
    <button class="dock-item more-active" id="more" type="button" aria-label="Open More menu" aria-controls="sheet" aria-expanded="true"><span class="dock-icon" aria-hidden="true">•••</span><span>More</span></button>
  </nav>
  <div class="flyout-tip" id="tip" aria-hidden="true"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header class="sheet-head">
      <h1 id="sheet-title">More pages</h1>
      <button class="close" id="close" type="button" aria-label="Close navigation">×</button>
    </header>
    <nav class="routes" aria-label="More pages">
      <section class="route-section">
        <h2 class="section-title">LIBRARY</h2>
        <a class="route" href="#galleries"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 7h10M7 12h10M7 17h6"/></svg><span class="route-label">Galleries</span><span class="route-arrow" aria-hidden="true">›</span></a>
      </section>
      <section class="route-section">
        <h2 class="section-title">PEOPLE &amp; METADATA</h2>
        <a class="route" href="#performers"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20v-1a6 6 0 0 1 12 0v1M16 5.5a3 3 0 0 1 0 5.8M18 14a5 5 0 0 1 3 4.5V20"/></svg><span class="route-label">Performers</span><span class="route-arrow" aria-hidden="true">›</span></a>
        <a class="route" href="#studios"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h.01M15 9h.01M9 13h.01M15 13h.01M10 21v-4h4v4"/></svg><span class="route-label">Studios</span><span class="route-arrow" aria-hidden="true">›</span></a>
        <a class="route" href="#groups"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg><span class="route-label">Groups</span><span class="route-arrow" aria-hidden="true">›</span></a>
        <a class="route" href="#tags"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1"/></svg><span class="route-label">Tags</span><span class="route-arrow" aria-hidden="true">›</span></a>
        <a class="route" href="#markers"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span class="route-label">Markers</span><span class="route-arrow" aria-hidden="true">›</span></a>
      </section>
      <section class="route-section">
        <h2 class="section-title">ACTIVITY</h2>
        <a class="route" href="#statistics"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="route-label">Statistics</span><span class="route-arrow" aria-hidden="true">›</span></a>
        <a class="route" href="#tasks"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span class="route-label">Tasks &amp; queue</span><span class="route-arrow" aria-hidden="true">›</span></a>
        <a class="route" href="#logs"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg><span class="route-label">Logs</span><span class="route-arrow" aria-hidden="true">›</span></a>
      </section>
      <section class="route-section">
        <h2 class="section-title">SETTINGS</h2>
        <a class="route" href="#settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 0 1-3.4 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.7 1.7 0 0 1-2.4-2.4l.1-.1A1.7 1.7 0 0 0 4.2 12H4a1.7 1.7 0 0 1 0-3.4h.2a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a1.7 1.7 0 0 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2V2a1.7 1.7 0 0 1 3.4 0v.2a1.7 1.7 0 0 0 2.9 1.2l.1-.1a1.7 1.7 0 0 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a1.7 1.7 0 0 1 0 3.4h-.2a1.7 1.7 0 0 0-1.2 2.9z"/></svg><span class="route-label">Settings</span><span class="route-arrow" aria-hidden="true">›</span></a>
      </section>
    </nav>
  </section>
  <script>
    (function () {
      var trigger = document.getElementById("more");
      var sheet = document.getElementById("sheet");
      var backdrop = document.getElementById("backdrop");
      var tip = document.getElementById("tip");
      var close = document.getElementById("close");
      var routes = Array.prototype.slice.call(document.querySelectorAll(".route"));
      var dockRoutes = Array.prototype.slice.call(document.querySelectorAll(".dock-item[href]"));

      function setOpen(open) {
        sheet.hidden = !open;
        backdrop.hidden = !open;
        tip.hidden = !open;
        trigger.setAttribute("aria-expanded", open ? "true" : "false");
        if (open) { close.focus({ preventScroll: true }); }
        else { trigger.focus({ preventScroll: true }); }
      }

      trigger.addEventListener("click", function () { setOpen(sheet.hidden); });
      close.addEventListener("click", function () { setOpen(false); });
      backdrop.addEventListener("click", function () { setOpen(false); });
      dockRoutes.forEach(function (route) {
        route.addEventListener("click", function (event) {
          event.preventDefault();
          setOpen(false);
        });
      });
      routes.forEach(function (route) {
        route.addEventListener("click", function (event) {
          event.preventDefault();
          routes.forEach(function (item) { item.removeAttribute("aria-current"); });
          route.setAttribute("aria-current", "page");
          setOpen(false);
        });
      });
      document.addEventListener("keydown", function (event) {
        if (sheet.hidden) { return; }
        if (event.key === "Escape") { setOpen(false); return; }
        if (event.key === "Tab") {
          var focusable = Array.prototype.slice.call(sheet.querySelectorAll("a[href], button:not([disabled])"));
          var first = focusable[0];
          var last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
          else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        }
      });
    }());
  </script>
</body>
</html>
