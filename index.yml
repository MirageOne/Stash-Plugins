    description: Rebirth is a video-first Stash theme with appearance preferences saved in the signed-in user's Stash UI settings, responsive navigation and mobile scene grids, an accent-responsive Stash box mark, custom switches, Geist typography, an automatically cycling home carousel for recently added, recently released, or randomly selected scenes on each page load, themed Settings and Help, neutral raised cards and grouped ratings on performer, studio, group, and tag detail pages, a native filter sidebar styled to match the theme and hidden when collapsed on detail pages, responsive pagination, a compact task queue, icon-centered mobile navigation, and a single accent-aware plugin launcher flyout. Installed plugin actions stay aligned; poster cards preserve the full Stash screenshot. The Tags page provides a hierarchy directory with parent and child filters, parent selection, A–Z browsing, favorites, and links to each tag's related content while retaining native search, sorting, pagination, bulk actions, and Tagger mode. It also includes distinct tag chips, theme-styled dropdowns, light and dark modes, eight accent colors, selected-accent primary buttons, outlined secondary actions, and semantic destructive actions.
