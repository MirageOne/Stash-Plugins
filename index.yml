  date: "2026-11-08 18:25:28"
  path: packages/rebirth/1.2.6.zip
  sha256: b5333c608cee8aff40a0f32da4902dde027c6e9f3a23b630ee9c435e39d2f10b
  requires: []
  metadata:
    description: Rebirth is a video-first Stash theme with appearance preferences saved in the signed-in user's Stash UI settings, responsive navigation and mobile scene grids, an accent-responsive Stash box mark, custom switches, Geist typography, an automatically cycling carousel, themed Settings and Help, neutral raised cards and grouped ratings across performer, studio, group, and tag detail pages, a native filter sidebar styled to match the theme and hidden when collapsed on performer, studio, group, and tag detail pages, responsive pagination, a compact task queue, icon-centered mobile navigation, and a single accent-aware plugin launcher flyout. Installed plugin action buttons stay aligned by reserving a consistent settings-expander column on every row. Poster cards preserve the full Stash screenshot inside their tall frames. The Tags page replaces icon tiles with a hierarchy directory, parent and child filters, parent selection, A–Z browsing, favorite controls, and links to each tag’s scenes, images, galleries, groups, markers, performers, and studios. Native search, sorting, pagination, bulk actions, and Tagger remain available. It also includes distinct tag chips, neutral Tagger results, evenly spaced performer actions, theme-styled dropdowns and selects, light and dark modes, eight accent colors, selected-accent primary buttons, outlined secondary actions, and semantic destructive actions.
