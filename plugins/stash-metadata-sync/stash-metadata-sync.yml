name: Stash Metadata Sync
description: Synchronize performer metadata and highest-resolution images, favorites, tags, scene markers, and ThePornDB movie groups.
version: 1.0.5
url: https://github.com/MirageOne/Stash-Plugins/tree/main/plugins/stash-metadata-sync
interface: raw
exec:
  - python
  - "{pluginDir}/stash_metadata_sync.py"

settings:
  cacheExpirationHours:
    displayName: Cache Expiration (Hours)
    description: How long successful StashBox and ThePornDB responses are cached.
    type: NUMBER
  rateLimit:
    displayName: Minimum Request Delay (Seconds)
    description: Additional delay between StashBox requests. StashBox request limits are respected as well.
    type: NUMBER
  enableStashDB:
    displayName: Enable StashDB
    description: Use the configured StashDB box for sync operations.
    type: BOOLEAN
  enableTPDB:
    displayName: Enable ThePornDB
    description: Use the configured ThePornDB box for sync operations.
    type: BOOLEAN
  enableFansDB:
    displayName: Enable FansDB
    description: Use the configured FansDB box for sync operations.
    type: BOOLEAN
  sourcePrecedence:
    displayName: Source Precedence
    description: Comma-separated merge priority, highest priority first (stashdb,tpdb,fansdb).
    type: STRING
  enableNameSearch:
    displayName: Match Performers by Name
    description: Search for exact name matches when a local performer has no ID for a source.
    type: BOOLEAN
  overwriteExisting:
    displayName: Overwrite Existing Metadata
    description: Replace populated local fields with values from the highest-priority configured source.
    type: BOOLEAN
  performerImageUpdate:
    displayName: Update Performer Images
    description: Import the highest-resolution image across configured sources when enabled, respecting the overwrite setting and quality threshold.
    type: BOOLEAN
  imageMinimumMegapixels:
    displayName: Minimum Performer Image Size (Megapixels)
    description: Skip source images smaller than this pixel count; the default 0.5 MP avoids importing small thumbnails.
    type: NUMBER
  imageMinimumLongEdge:
    displayName: Minimum Performer Image Long Edge (Pixels)
    description: Skip source images whose longest edge is shorter than this value.
    type: NUMBER
  replaceUnmeasurableImages:
    displayName: Replace Images With Unknown Resolution
    description: Allow an image upgrade when Stash cannot read the current image dimensions. Off by default to avoid replacing a sharper image blindly.
    type: BOOLEAN
  autoCreatePerformers:
    displayName: Create Missing Performers
    description: Create local performers when importing favorites that do not already exist.
    type: BOOLEAN
  autoCreateStudios:
    displayName: Create Missing Studios
    description: Create local studios when importing favorite studios that do not already exist.
    type: BOOLEAN
  overwriteTagMetadata:
    displayName: Overwrite Tag Descriptions
    description: Replace populated local tag descriptions with the highest-priority StashBox description. Aliases are always merged without deleting local aliases.
    type: BOOLEAN
  overwriteTagNames:
    displayName: Overwrite Tag Names
    description: Rename matched local tags to the highest-priority StashBox name. Off by default to preserve local naming and hierarchy.
    type: BOOLEAN
  syncSceneTagsDryRun:
    displayName: Scene Tag Sync Dry Run
    description: Preview scene-tag additions without writing changes. The preview checks at most 200 scenes across all enabled sources.
    type: BOOLEAN
  sceneTagBlacklist:
    displayName: Scene Tag Sync Exclusions
    description: Exact tag names to skip during scene-tag sync, separated by commas, semicolons, or new lines.
    type: STRING
  syncSceneMarkersDryRun:
    displayName: Scene Marker Sync Dry Run
    description: Preview ThePornDB marker additions without writing changes. The preview checks at most 200 scenes.
    type: BOOLEAN
  tagImportedMarkers:
    displayName: Tag Imported Markers
    description: Add the [TPDBMarker] tag to imported markers. The primary marker tag is created when needed.
    type: BOOLEAN
  syncSceneGroupsDryRun:
    displayName: Scene Group Sync Dry Run
    description: Preview ThePornDB movie-to-group imports and scene links without writing changes. The preview checks at most 200 scenes.
    type: BOOLEAN
  overwriteGroupMetadata:
    displayName: Overwrite Group Metadata
    description: Replace populated group dates, synopsis, and images from ThePornDB. Stash names and existing studio links remain unchanged.
    type: BOOLEAN

tasks:
  - name: Update All Performers
    description: Fill or refresh performer metadata from matching configured StashBox records.
    defaultArgs:
      mode: update_all_performers
  - name: Preview Performer Image Upgrades
    description: Compare performer images from all configured StashBoxes with current local image dimensions without changing any images.
    defaultArgs:
      mode: preview_performer_images
  - name: Sync Highest-Quality Performer Images
    description: Import the best available image across configured StashBoxes when it meets the quality threshold and improves on the current image.
    defaultArgs:
      mode: sync_performer_images
  - name: Sync All Tag Metadata
    description: Update matched local tags from configured StashBox tags; descriptions are preserved unless overwrite is enabled and aliases are merged.
    defaultArgs:
      mode: sync_all_tags
  - name: Sync Scene Tags
    description: Add missing local tags to scenes from their linked StashBox scenes. Dry run is enabled by default and removed local tags are not re-added.
    defaultArgs:
      mode: sync_scene_tags
  - name: Reset Scene Tag Sync History
    description: Forget which StashBox tags were synchronized to scenes. The next live sync can add those tags again.
    defaultArgs:
      mode: reset_scene_tag_sync_history
  - name: Sync ThePornDB Scene Markers
    description: Merge missing markers from ThePornDB into scenes with a configured ThePornDB stash ID. Dry run is enabled by default; existing markers are preserved.
    defaultArgs:
      mode: sync_scene_markers
  - name: Sync ThePornDB Groups
    description: Import ThePornDB movie records as Stash groups and add each group to its linked scene. Dry run is enabled by default; existing scene groups are preserved.
    defaultArgs:
      mode: sync_scene_groups
  - name: Sync Favorite Performers
    description: Mark matching local performers as favorites, optionally creating missing records.
    defaultArgs:
      mode: sync_favorite_performers
  - name: Sync Favorite Studios
    description: Mark matching local studios as favorites, optionally creating missing records.
    defaultArgs:
      mode: sync_favorite_studios
  - name: Test Connections
    description: Test authentication and GraphQL access for enabled, configured StashBox sources.
    defaultArgs:
      mode: test_connections
  - name: Validate Configuration
    description: Check source detection and configuration without making external requests.
    defaultArgs:
      mode: validate_config
  - name: Clear Cache
    description: Remove cached StashBox responses.
    defaultArgs:
      mode: clear_cache
  - name: Generate Sync Report
    description: Report performer, studio, and source ID coverage in the local library.
    defaultArgs:
      mode: generate_sync_report

ui:
  javascript:
    - stash_metadata_sync.js
